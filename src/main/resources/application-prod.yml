spring:
  # PostgreSQL — activate with SPRING_PROFILES_ACTIVE=prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skillsphere}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:skillsphere}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      # No Flyway/Liquibase migration tool is wired up yet — 'update' is used so the
      # schema is created automatically. Before real production traffic, add a
      # migration tool and switch this to 'validate'.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT secret and expiration MUST be overridden via env vars in production —
# see the default in application.yml for local/dev only.
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${PORT:8080}