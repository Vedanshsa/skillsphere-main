# Local full stack: PostgreSQL + backend (prod profile, Flyway migrations).
# Usage: copy .env.example to .env, then: docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-skillsphere}
      POSTGRES_USER: ${DB_USERNAME:-skillsphere}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-skillsphere}"]
      interval: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-skillsphere}
      DB_USERNAME: ${DB_USERNAME:-skillsphere}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports: ["8080:8080"]

volumes:
  pgdata:
